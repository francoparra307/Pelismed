<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Películas - PelisMed</title>
    <!-- Vinculación al CSS principal -->
    <link rel="stylesheet" href="stylepeliculas.css">
</head>
<body>

    <!-- Encabezado de la web -->
    <header>
        <h1>PelisMed</h1>
        
        <!-- Botones de navegación superior -->
        <nav class="nav-container">
            <a href="index.html" class="btn-nav">Inicio</a>
            <a href="series.html" class="btn-nav">Series</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Catálogo de Películas</h2>
            
            <!-- Grilla de Películas con Portada, Nombre y Botón Play -->
            <div class="movies-grid">
                
                <!-- Película 1 -->
                <article class="movie-card">
                    <img src="https://placeholder.com" alt="Portada Película 1" class="movie-poster">
                    <div class="movie-info">
                        <h3 class="movie-title">Película de Acción 1</h3>
                        <button class="btn-play">▶ Dale Play</button>
                    </div>
                </article>

                <!-- Película 2 -->
                <article class="movie-card">
                    <img src="https://placeholder.com" alt="Portada Película 2" class="movie-poster">
                    <div class="movie-info">
                        <h3 class="movie-title">Película de Drama 2</h3>
                        <button class="btn-play">▶ Dale Play</button>
                    </div>
                </article>

                <!-- Película 3 -->
                <article class="movie-card">
                    <img src="https://placeholder.com" alt="Portada Película 3" class="movie-poster">
                    <div class="movie-info">
                        <h3 class="movie-title">Película de Ciencia Ficción 3</h3>
                        <button class="btn-play">▶ Dale Play</button>
                    </div>
                </article>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 PelisMed. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
